.2em;line-height:0.95;text-transform:uppercase;color:#fff;text-shadow:0 18px 40px rgba(0,0,0,0.55)}.hero-tagline{margin:26px auto 0;max-width:700px;color:rgba(255,255,255,0.76);letter-spacing:0.06em}@media(max-width:760px){body{overflow-x:clip}.page-shell{padding:12px 16px 36px}.topbar{position:sticky;top:8px;left:auto;transform:none;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;padding:10px 12px;border-radius:18px}.nav-links{grid-column:1/-1;gap:6px;flex-wrap:nowrap;overflow-x:auto;justify-content:space-between}.nav-link{min-height:44px;display:inline-flex;align-items:center;justify-content:center;flex:1 0 auto;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.04);white-space:nowrap}.cta-link{justify-self:end;min-height:44px;padding:9px 14px}.hero{min-height:clamp(360px,68dvh,560px);aspect-ratio:auto;margin:18px 0 44px;padding:44px 18px;border-radius:18px;background-position:center top}.hero-label{font-size:.76rem;letter-spacing:.18em}.hero h1{font-size:clamp(3rem,17vw,4.8rem);letter-spacing:.08em;overflow-wrap:anywhere}.hero-tagline{font-size:.98rem;line-height:1.7;letter-spacing:.02em}}@media(max-width:420px){.page-shell{padding-inline:12px}.hero{min-height:330px;padding-inline:14px}.hero h1{font-size:clamp(2.55rem,16vw,3.7rem);letter-spacing:.055em}}
