        <div class="project-intro">
          <p>NutriAI 是一款基于人工智能的智能营养助手，通过图像识别与营养学模型，为用户提供精准的食物营养分析、个性化膳食计划与健康饮食建议。</p>
          <p>项目以 “用户画像+AI 算法＋科学膳食” 为核心，帮助用户轻松记录饮食、追踪营养摄入，并根据身体目标自动生成均衡、可执行的每日餐单。</p>
